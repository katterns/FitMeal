name: fitmeal-ai

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://fitmeal:fitmeal@postgres:5432/fitmeal
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    build: .
    command: celery -A infra.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://fitmeal:fitmeal@postgres:5432/fitmeal
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
    depends_on:
      - postgres
      - redis

  streamlit:
    build: .
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fitmeal
      POSTGRES_USER: fitmeal
      POSTGRES_PASSWORD: fitmeal
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
